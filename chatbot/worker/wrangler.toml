name = "scienceit-docs-chat"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Non-secret configuration. Every value here can be overridden per-environment,
# and locally through .dev.vars. The API key is NOT here: it is a secret
# (`wrangler secret put CBORG_API_KEY`).
[vars]
# CBorg's OpenAI-compatible gateway. Confirm in the CBorg docs.
CBORG_BASE_URL = "https://api.cborg.lbl.gov"
# TODO: confirm the current model IDs in the CBorg docs before deploying.
CBORG_MODEL = "lbl/cborg-mini-fast"
# Where the Worker fetches the documentation text (cached for 1 hour).
LLMS_FULL_URL = "https://scienceit-docs.lbl.gov/llms-full.txt"
# Comma-separated list of origins allowed to call /chat (no trailing slashes).
# Matched exactly against the request's Origin header, so this is the origin the
# docs site is served from — not the Worker's own URL. Production only: for
# local dev, override it in .dev.vars (see .dev.vars.example) so localhost
# origins never reach the deployed Worker.
ALLOWED_ORIGINS = "https://scienceit-docs.lbl.gov"
# Context window of the chosen model, used only for the size warning.
MODEL_CONTEXT_TOKENS = "128000"
# Request validation limits.
MAX_MESSAGES = "20"
MAX_MESSAGE_CHARS = "4000"
MAX_PAYLOAD_BYTES = "60000"
# Cap on generated tokens per reply.
MAX_OUTPUT_TOKENS = "1000"
# Upstream timeouts, in milliseconds. UPSTREAM_TIMEOUT_MS bounds the wait for
# CBorg's response headers only, not the length of the stream that follows, so
# raising MAX_OUTPUT_TOKENS does not require raising this.
DOCS_FETCH_TIMEOUT_MS = "10000"
UPSTREAM_TIMEOUT_MS = "90000"

# Idle window: how long a session survives without a request. Rolled forward on
# every request, so an active reader is never interrupted.
SESSION_TTL_MINUTES = "30"
# Absolute ceiling on one solved challenge, however active the client. Caps the
# rolling window above, which would otherwise grant indefinite access.
SESSION_MAX_HOURS = "4"

# Per-IP rate limiting via Cloudflare's rate limiting binding.
# `period` must be 10 or 60 (seconds). `namespace_id` is any unique integer
# string within your account.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Global ceiling across ALL callers, keyed on a constant. Per-IP limits bound
# individual abusers but not total spend; this is the actual cost cap. Raise it
# once you know what a busy day looks like — it should sit above normal peak
# traffic and below a budget you would be unhappy to pay.
[[ratelimits]]
name = "GLOBAL_LIMITER"
namespace_id = "1002"
simple = { limit = 120, period = 60 }
